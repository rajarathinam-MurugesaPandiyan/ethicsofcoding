<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethics Of Coding | Developer Education &amp; xpense-cloud</title>
    <meta
      name="description"
      content="Ethics Of Coding: Premier software engineering masterclasses in Tamil &amp; home of xpense-cloud, our flagship cloud financial intelligence and budget tracking platform."
    />
    <meta name="keywords" content="Ethics of Coding, xpense-cloud, Flutter Tamil, Coding in Tamil, Web Development, Software Engineering, BLoC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Inline Script to Avoid Theme FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ethics-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
